<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Follower Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .progress { height: 30px; margin: 20px 0; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">Instagram Follower Scraper</h2>

        <!-- Login Section -->
        <div id="login-section">
            <h4>Login</h4>
            <div class="mb-3">
                <label class="form-label">Usuário</label>
                <input type="text" id="username" class="form-control" placeholder="Seu usuário do Instagram">
            </div>
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" id="password" class="form-control" placeholder="Sua senha">
            </div>
            <button onclick="login()" id="login-btn" class="btn btn-primary w-100">Entrar</button>
            <div id="login-msg" class="mt-3"></div>
        </div>

        <!-- Scrape Section -->
        <div id="scrape-section" class="hidden">
            <h4>Configuração da Extração</h4>
            <div class="mb-3">
                <label class="form-label">Perfil Alvo (@)</label>
                <input type="text" id="target" class="form-control" placeholder="Ex: neymarjr">
            </div>
            <button onclick="startScrape()" id="start-btn" class="btn btn-success w-100">Iniciar Extração</button>

            <div id="progress-container" class="mt-4 hidden">
                <h5>Progresso: <span id="progress-text">0/0</span></h5>
                <div class="progress">
                    <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 0%"></div>
                </div>
                <div class="d-flex justify-content-between">
                    <button onclick="pauseScrape()" id="pause-btn" class="btn btn-warning">Pausar</button>
                    <button onclick="resumeScrape()" id="resume-btn" class="btn btn-info hidden">Retomar</button>
                    <button onclick="stopScrape()" id="stop-btn" class="btn btn-danger">Parar e Salvar</button>
                </div>
                <div id="status-msg" class="mt-3 text-center text-muted"></div>
            </div>

            <div id="download-section" class="mt-4 hidden text-center">
                <hr>
                <p>Extração concluída ou interrompida!</p>
                <a href="/download" class="btn btn-dark">Baixar CSV</a>
            </div>
        </div>
    </div>

    <script>
        let statusInterval;

        async function login() {
            const btn = document.getElementById('login-btn');
            const msg = document.getElementById('login-msg');
            btn.disabled = true;
            msg.innerText = "Fazendo login... aguarde.";

            const res = await fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    username: document.getElementById('username').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('scrape-section').classList.remove('hidden');
            } else {
                msg.innerHTML = `<div class="alert alert-danger">${data.message}</div>`;
                btn.disabled = false;
            }
        }

        async function startScrape() {
            const target = document.getElementById('target').value;
            const res = await fetch('/start_scrape', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({target})
            });
            const data = await res.json();

            if (data.success) {
                document.getElementById('progress-container').classList.remove('hidden');
                document.getElementById('start-btn').disabled = true;
                startStatusPolling();
            }
        }

        function startStatusPolling() {
            statusInterval = setInterval(async () => {
                const res = await fetch('/status');
                const data = await res.json();

                const percent = (data.progress / data.total * 100) || 0;
                document.getElementById('progress-bar').style.width = percent + '%';
                document.getElementById('progress-text').innerText = `${data.progress} / ${data.total}`;

                if (data.paused) {
                    document.getElementById('pause-btn').classList.add('hidden');
                    document.getElementById('resume-btn').classList.remove('hidden');
                    document.getElementById('status-msg').innerText = "Pausado.";
                } else {
                    document.getElementById('pause-btn').classList.remove('hidden');
                    document.getElementById('resume-btn').classList.add('hidden');
                    document.getElementById('status-msg').innerText = data.running ? "Extraindo dados... por favor, mantenha esta aba aberta." : "Processo finalizado.";
                }

                if (!data.running && data.progress > 0 && !data.paused) {
                    clearInterval(statusInterval);
                    document.getElementById('download-section').classList.remove('hidden');
                }

                if (data.error) {
                    clearInterval(statusInterval);
                    alert("Erro: " + data.error);
                }
            }, 2000);
        }

        async function pauseScrape() { await fetch('/pause', {method: 'POST'}); }
        async function resumeScrape() { await fetch('/resume', {method: 'POST'}); }
        async function stopScrape() {
            await fetch('/stop', {method: 'POST'});
            clearInterval(statusInterval);
            document.getElementById('download-section').classList.remove('hidden');
        }
    </script>
</body>
</html>
